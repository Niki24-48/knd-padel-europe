name: Validate KND build and SEO
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'fix/**', 'feature/**']
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify:seo
      - run: npm run verify:journal
      - run: npm run verify:editorial
      - run: npm run verify:guides
      - run: npm run verify:ssg
      - run: npm run verify:performance
      - run: npm run verify:courts
      - run: npm run verify:roofs
      - run: npm run verify:about
