name: Validate KND build and SEO
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/seo-merge-build-2026-11-05]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify:seo
      - run: npm run verify:courts
