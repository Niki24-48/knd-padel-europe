name: One-time KND turf fibre asset import
on:
  push:
    branches: [fix/knd-menu-photos-contact-2026-11-06]
    paths:
      - .github/workflows/import-knd-fibre-assets.yml
      - scripts/import-knd-fibre-assets.mjs
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/import-knd-fibre-assets.mjs
      - name: Commit matching images to working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/knd/turf/fibres scripts/imported-turf-image-manifest.json
          git diff --cached --quiet || git commit -m "assets: import original five turf fibre diagrams with verified alt text"
          git push origin HEAD:fix/knd-menu-photos-contact-2026-11-06
